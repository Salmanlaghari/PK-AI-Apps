<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640" font-family="'Poppins', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A800FF"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0520"/>
      <stop offset="1" stop-color="#010410"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="18" y="18" width="284" height="604" rx="34"/>
    </clipPath>
  </defs>

  <!-- Phone frame -->
  <rect x="8" y="8" width="304" height="624" rx="42" fill="#15132b" stroke="#2a2740" stroke-width="2"/>
  <rect x="18" y="18" width="284" height="604" rx="34" fill="url(#bg)"/>

  <g clip-path="url(#screen)">
    <!-- Header -->
    <rect x="18" y="18" width="284" height="104" fill="url(#grad)"/>
    <rect x="18" y="92" width="284" height="30" fill="url(#grad)"/>
    <circle cx="56" cy="66" r="20" fill="#0b0a1a"/>
    <text x="56" y="72" text-anchor="middle" fill="#00F0FF" font-size="18" font-weight="800">P</text>
    <text x="88" y="62" fill="#ffffff" font-size="20" font-weight="800">PK AI</text>
    <text x="88" y="82" fill="#e6e6ff" font-size="10" font-weight="500" opacity="0.85">Premium AI Super App</text>

    <!-- AI bubble -->
    <rect x="30" y="146" width="184" height="46" rx="18" fill="#1c1830"/>
    <text x="44" y="174" fill="#cfcae6" font-size="12">Hey! How can I help</text>
    <text x="44" y="188" fill="#cfcae6" font-size="12">you today? 🤖</text>

    <!-- User bubble -->
    <rect x="120" y="208" width="160" height="40" rx="16" fill="url(#grad)"/>
    <text x="134" y="233" fill="#0b0a1a" font-size="12" font-weight="700">Summarize this PDF</text>

    <!-- AI bubble 2 -->
    <rect x="30" y="262" width="220" height="84" rx="18" fill="#1c1830"/>
    <text x="44" y="288" fill="#cfcae6" font-size="12">Here's a quick summary of</text>
    <text x="44" y="304" fill="#cfcae6" font-size="12">the key points from your</text>
    <text x="44" y="320" fill="#cfcae6" font-size="12">document in 3 bullet</text>
    <text x="44" y="336" fill="#cfcae6" font-size="12">points... ✨</text>

    <!-- Model chips -->
    <rect x="30" y="368" width="78" height="30" rx="15" fill="#241f3a"/>
    <text x="69" y="388" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="700">Multi-Model</text>
    <rect x="116" y="368" width="64" height="30" rx="15" fill="#241f3a"/>
    <text x="148" y="388" text-anchor="middle" fill="#A800FF" font-size="11" font-weight="700">Voice AI</text>
    <rect x="188" y="368" width="56" height="30" rx="15" fill="#241f3a"/>
    <text x="216" y="388" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Web AI</text>

    <!-- Feature row -->
    <rect x="30" y="418" width="260" height="64" rx="16" fill="#15132b" stroke="#2a2740"/>
    <text x="46" y="442" fill="#ffffff" font-size="12" font-weight="700">⚡ 9 AI Models</text>
    <text x="46" y="462" fill="#9ca3af" font-size="10">Chat • Image • Voice • Code</text>

    <!-- Input bar -->
    <rect x="30" y="544" width="260" height="46" rx="23" fill="#15132b" stroke="#2a2740"/>
    <text x="48" y="572" fill="#6b7280" font-size="12">Ask anything...</text>
    <circle cx="266" cy="567" r="17" fill="url(#grad)"/>
    <path d="M260 567 l5 -5 l5 5 m-5 -5 v10" stroke="#0b0a1a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
